# Настройки конвейера ShortsVideoMaker.
# Файл читается autocut.py. Любое значение можно переопределить флагом
# командной строки — флаг всегда главнее.

# ---------------------------------------------------------------- субтитры --
subtitles:
  # Шрифт. Должен быть установлен в системе; если такого нет, libass молча
  # возьмёт похожий. Для кириллицы надёжны Arial, DejaVu Sans, Liberation Sans.
  font: "Arial"
  # Размер в пикселях по кадру 1080x1920. 96 ≈ 5% высоты — крупно, как в TikTok.
  font_size: 96
  bold: true
  # Цвета в обычном формате #RRGGBB.
  color: "#FFFFFF"           # обычное слово
  active_color: "#FFD400"    # слово, которое звучит прямо сейчас
  outline_color: "#000000"   # обводка
  outline: 6                 # толщина обводки в пикселях
  shadow: 2                  # тень
  # Положение центра строки: доля высоты кадра сверху (0.78 — нижняя треть).
  position: 0.78
  # Отступы слева и справа, чтобы длинные строки переносились красиво.
  margin_x: 60
  # Сколько слов в одной реплике.
  words_per_cue: 4
  # Разрывать реплику, если между словами пауза длиннее этого (секунды).
  cue_gap: 0.55
  # Как подсвечивать активное слово:
  #   karaoke — теги \k, слова заливаются цветом одно за другим (классика);
  #   current — подсвечено только то слово, которое звучит сейчас.
  highlight_mode: karaoke
  # ЗАГЛАВНЫМИ. Часто выглядит выразительнее на коротких клипах.
  uppercase: false
  # Подписывать паузы, где звук есть, а слов нет: [СМЕХ] или [МУЗЫКА].
  # Смех отличается от музыки по «рваности» громкости.
  sound_tags: true
  # Выбрасывать текст, придуманный моделью поверх тишины, и зацикленные
  # повторы. Whisper этим грешит на музыке и в паузах.
  drop_hallucinations: true

# ------------------------------------------------------------ надпись части --
part_label:
  enabled: true
  # {n} — номер части, {total} — сколько всего частей.
  text: "Часть {n}"
  font_size: 64
  color: "#FFFFFF"
  outline_color: "#000000"
  outline: 4
  # Отступ сверху в пикселях.
  margin_top: 90
  # Путь к TTF-файлу шрифта. Пусто — подберётся автоматически
  # (Windows: arialbd.ttf, Linux: DejaVuSans-Bold.ttf).
  font_file: ""

# --------------------------------------------------------------- нарезка ----
cut:
  target_len: 60      # желаемая длина части, секунды
  min_len: 30
  max_len: 90
  # Пауза в речи, которая считается безопасным местом для склейки.
  min_pause: 0.6

# ---------------------------------------------------------------- рендер ----
render:
  width: 1080
  height: 1920
  fps: 30
  video_codec: "libx264"
  preset: "medium"
  video_bitrate: "8M"
  audio_codec: "aac"
  audio_bitrate: "192k"
  # Горизонтальный сдвиг кадра при обрезке в 9:16: 0 — левый край,
  # 0.5 — центр, 1 — правый край.
  crop: 0.5

# ------------------------------------------------------------ распознавание --
asr:
  model: "small"      # tiny / base / small / medium / large-v3
  language: "ru"      # ru / en / auto
  # Отбрасывать куски без речи перед распознаванием — заметно быстрее.
  vad_filter: true
  beam_size: 5

# --------------------------------------------------------------- внешнее ----
tools:
  # Путь к ffmpeg и ffprobe. Пусто — искать в PATH.
  ffmpeg: ""
  ffprobe: ""
